<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculatrice</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="calculatrice">
        <div id="ecran"></div>

        <div id="boutons">
            <button>7</button>
            <button>8</button>
            <button>9</button>
            <button>/</button>

            <button>4</button>
            <button>5</button>
            <button>6</button>
            <button>*</button>

            <button>1</button>
            <button>2</button>
            <button>3</button>
            <button>-</button>

            <button>&larr;</button>
            <button>.</button>
            <button>0</button>
            <button>+</button>

            <button>C</button>
            <button>=</button>
        </div>
    </div>
     // JavaScript pour la logique de la calculatrice
    <script>
        const ecran = document.getElementById('ecran');
        const boutons = document.querySelectorAll('#boutons button');
        const operateurs = ['+', '-', '*', '/'];

        boutons.forEach(button => {
            button.addEventListener('click', () => {
                const value = button.textContent;
                const dernierCaractere = ecran.textContent.slice(-1);

                if (value === 'C') {
                    ecran.textContent = '';
                    return;
                }

                if (value === '=') {
                    if (ecran.textContent === '' || operateurs.includes(dernierCaractere)) {
                        return;
                    }

                    try {
                        ecran.textContent = Function(`return ${ecran.textContent}`)();
                    } catch (error) {
                        ecran.textContent = 'Erreur';
                    }

                    return;
                }

                if (value === '←') {
                    ecran.textContent = ecran.textContent.slice(0, -1);
                    return;
                }

                if (value === '.') {
                    if (ecran.textContent === '' || operateurs.includes(dernierCaractere)) {
                        ecran.textContent += '0.';
                    } else {
                        const dernierNombre = ecran.textContent.split(/[+\-*/]/).pop();

                        if (!dernierNombre.includes('.')) {
                            ecran.textContent += '.';
                        }
                    }

                    return;
                }

                if (operateurs.includes(value)) {
                    if (ecran.textContent === '' || operateurs.includes(dernierCaractere)) {
                        return;
                    }

                    ecran.textContent += value;
                    return;
                }

                if (ecran.textContent === 'Erreur') {
                    ecran.textContent = '';
                }

                ecran.textContent += value;
            });
        });
    </script>
</body>
</html>
