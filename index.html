<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Une calculatrice scientifique en ligne moderne, élégante et complète. Supporte les fonctions trigonométriques, logarithmes, factoriel, historique et conversion degré/radian.">
    <title>Calculatrice Scientifique Premium</title>
    <!-- Google Fonts: Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <!-- Ionicons for modern icons -->
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
</head>
<body>
    <!-- Background Animated Blobs -->
    <div class="blob blob-1" aria-hidden="true"></div>
    <div class="blob blob-2" aria-hidden="true"></div>

    <main id="app-container">
        <!-- Main Calculator Card -->
        <section id="calculatrice" aria-label="Calculatrice Scientifique">
            <!-- Header with controls -->
            <header id="calc-header">
                <h1 id="calc-logo">CalcuScientific</h1>
                <div class="controls-right">
                    <!-- Radian / Degree Toggle Button -->
                    <button id="btn-mode" class="header-btn" aria-label="Basculer entre Degré et Radian">DEG</button>
                    <!-- History Toggle Button -->
                    <button id="btn-history-toggle" class="header-btn" aria-label="Afficher l'historique">
                        <ion-icon name="time-outline"></ion-icon>
                    </button>
                </div>
            </header>

            <!-- Screen display area -->
            <div id="ecran-container">
                <!-- Upper screen: shows current formula / history preview -->
                <div id="ecran-formule" aria-live="polite"></div>
                <!-- Main screen: shows active number input or evaluation result -->
                <div id="ecran-resultat" aria-live="polite">0</div>
            </div>

            <!-- Keyboard Layout -->
            <div id="boutons" role="grid" aria-label="Clavier numérique et scientifique">
                <!-- Row 1 -->
                <button id="btn-clear" class="btn-sci btn-clear" role="gridcell">C</button>
                <button id="btn-lparen" class="btn-sci" role="gridcell">(</button>
                <button id="btn-rparen" class="btn-sci" role="gridcell">)</button>
                <button id="btn-mod" class="btn-sci" role="gridcell">mod</button>
                <button id="btn-backspace" class="btn-sci btn-delete" role="gridcell" aria-label="Effacer le dernier caractère">
                    <ion-icon name="backspace-outline"></ion-icon>
                </button>

                <!-- Row 2 -->
                <button id="btn-sin" class="btn-sci" role="gridcell">sin</button>
                <button id="btn-cos" class="btn-sci" role="gridcell">cos</button>
                <button id="btn-tan" class="btn-sci" role="gridcell">tan</button>
                <button id="btn-power" class="btn-sci" role="gridcell">x<sup>y</sup></button>
                <button id="btn-sqrt" class="btn-sci" role="gridcell">√</button>

                <!-- Row 3 -->
                <button id="btn-ln" class="btn-sci" role="gridcell">ln</button>
                <button id="btn-log" class="btn-sci" role="gridcell">log</button>
                <button id="btn-pi" class="btn-sci" role="gridcell">π</button>
                <button id="btn-e" class="btn-sci" role="gridcell">e</button>
                <button id="btn-div" class="btn-op" role="gridcell">÷</button>

                <!-- Row 4 -->
                <button id="btn-7" class="btn-num" role="gridcell">7</button>
                <button id="btn-8" class="btn-num" role="gridcell">8</button>
                <button id="btn-9" class="btn-num" role="gridcell">9</button>
                <button id="btn-mul" class="btn-op" role="gridcell">×</button>
                <button id="btn-sqr" class="btn-sci" role="gridcell">x²</button>

                <!-- Row 5 -->
                <button id="btn-4" class="btn-num" role="gridcell">4</button>
                <button id="btn-5" class="btn-num" role="gridcell">5</button>
                <button id="btn-6" class="btn-num" role="gridcell">6</button>
                <button id="btn-sub" class="btn-op" role="gridcell">-</button>
                <button id="btn-fact" class="btn-sci" role="gridcell">x!</button>

                <!-- Row 6 -->
                <button id="btn-1" class="btn-num" role="gridcell">1</button>
                <button id="btn-2" class="btn-num" role="gridcell">2</button>
                <button id="btn-3" class="btn-num" role="gridcell">3</button>
                <button id="btn-add" class="btn-op" role="gridcell">+</button>
                <button id="btn-ans" class="btn-sci" role="gridcell">Ans</button>

                <!-- Row 7 -->
                <button id="btn-neg" class="btn-num" role="gridcell">±</button>
                <button id="btn-0" class="btn-num" role="gridcell">0</button>
                <button id="btn-dot" class="btn-num" role="gridcell">.</button>
                <button id="btn-equal" class="btn-equal" role="gridcell" style="grid-column: span 2;">=</button>
            </div>

            <!-- History Drawer Sidebar -->
            <aside id="drawer-historique" aria-label="Historique des calculs">
                <div class="drawer-header">
                    <h2>Historique</h2>
                    <div class="drawer-actions">
                        <button id="btn-clear-history" aria-label="Effacer tout l'historique">
                            <ion-icon name="trash-outline"></ion-icon>
                        </button>
                        <button id="btn-close-history" aria-label="Fermer l'historique">
                            <ion-icon name="close-outline"></ion-icon>
                        </button>
                    </div>
                </div>
                <div id="history-list-container">
                    <ul id="history-list" aria-live="polite">
                        <!-- History items will be injected dynamically -->
                    </ul>
                    <div id="no-history-msg">Aucun historique disponible</div>
                </div>
            </aside>
        </section>
    </main>

    <script src="script.js" defer></script>
</body>
</html>
